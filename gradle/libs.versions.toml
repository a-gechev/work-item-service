# Every third-party version in this repository is declared here and nowhere else.
# Gradle finds this file by convention — settings.gradle.kts needs no wiring for it.

[versions]
spring-boot = "4.1.1"
junit       = "6.1.3"
archunit    = "1.5.0"
assertj     = "3.27.7"
mockito     = "5.23.0"

[libraries]
# Platforms (BOMs). Imported with platform(...); they constrain versions, they are not dependencies.
junit-bom       = { module = "org.junit:junit-bom", version.ref = "junit" }
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }

# Versionless on purpose — junit-bom governs both.
junit-jupiter           = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

assertj-core    = { module = "org.assertj:assertj-core",              version.ref = "assertj" }
mockito-core    = { module = "org.mockito:mockito-core",              version.ref = "mockito" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5",  version.ref = "archunit" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }